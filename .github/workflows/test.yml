name: Validate qualitative analysis toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce synthetic example
        run: python qualitative_audit.py --codebook examples/illustrative_codebook.csv --coding examples/synthetic_coded_segments.csv --output /tmp/msc-example --label "Synthetic example"
